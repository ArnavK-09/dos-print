build:
  maxIssues: 0

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 200
  LongParameterList:
    active: true
    functionThreshold: 12
    constructorThreshold: 12
    ignoreDefaultParameters: true
  TooManyFunctions:
    active: true
    thresholdInFiles: 60
    thresholdInClasses: 40
    thresholdInInterfaces: 40
    thresholdInObjects: 40
    thresholdInEnums: 40
    ignoreDeprecated: true
    ignorePrivate: true
  CyclomaticComplexMethod:
    active: true
    threshold: 60
  NestedBlockDepth:
    active: true
    threshold: 6
  LargeClass:
    active: true
    # The vector icon catalogue and the Studio editor are cohesive by design.
    threshold: 700

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
  InstanceOfCheckForException:
    active: true

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']
  FunctionParameterNaming:
    active: true
  VariableNaming:
    active: true
  TopLevelPropertyNaming:
    active: true
    constantPattern: "[A-Za-z][_A-Za-z0-9]*"

performance:
  active: true
  SpreadOperator:
    active: true

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: false
  UnusedUnaryOperator:
    active: true
  ImplicitDefaultLocale:
    active: true
  MissingPackageDeclaration:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  CastNullableToNonNullableType:
    active: true
  CastToNullableType:
    active: false
  Deprecation:
    active: false

style:
  active: true
  MagicNumber:
    active: false
    ignoreNumbers: ['-1', '0', '1', '2', '4', '8', '9', '16', '32', '100', '255', '256', '1000', '1024']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreConstantDeclaration: true
    ignoreAnnotation: true
    ignoreEnums: true
    ignoreRanges: true
    ignoreNamedArgument: true
    excludes: ['**/test/**', '**/androidTest/**']
  MaxLineLength:
    active: false
    maxLineLength: 120
    excludeCommentStatements: true
  ReturnCount:
    active: true
    max: 6
  UnusedPrivateMember:
    active: true
  ForbiddenComment:
    active: true
    comments:
      - reason: 'No TODO markers allowed in production code'
        value: 'TODO:'
      - reason: 'No FIXME markers allowed in production code'
        value: 'FIXME:'
  ThrowsCount:
    active: true
    max: 4
  UnnecessaryAbstractClass:
    active: true
  UseDataClass:
    active: false
  WildcardImport:
    active: false
  LoopWithTooManyJumpStatements:
    active: true
    maxJumpCount: 4
  OptionalUnit:
    active: false
  MandatoryBracesLoops:
    active: false
  BracesOnIfStatements:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    active: true
    maxDestructuringEntries: 3

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: false
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunWithFlowReturnType:
    active: true
